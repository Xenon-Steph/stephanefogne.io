<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TD1 - Géolocalisation</title>
    <link rel="stylesheet" href="geo.css">
</head>
<body>

    <a href="../../index.html">← Retour</a>

    <h1>Géolocalisation</h1>
    <p id="statut">Recherche de la position...</p>

    <section>
        <h2>getCurrentPosition()</h2>
        <ul>
            <li>Longitude <span id="current-lon">-</span></li>
            <li>Latitude <span id="current-lat">-</span></li>
            <li>Altitude <span id="current-alt">-</span></li>
            <li>Précision <span id="current-precision">-</span></li>
            <li>Vitesse <span id="current-vitesse">-</span></li>
            <li>Date <span id="current-date">-</span></li>
        </ul>
    </section>

    <section>
        <h2>watchPosition()</h2>
        <ul>
            <li>Longitude <span id="watch-lon">-</span></li>
            <li>Latitude <span id="watch-lat">-</span></li>
            <li>Altitude <span id="watch-alt">-</span></li>
            <li>Précision <span id="watch-precision">-</span></li>
            <li>Vitesse <span id="watch-vitesse">-</span></li>
            <li>Date <span id="watch-date">-</span></li>
        </ul>
    </section>

    <script src="geo.js"></script>
</body>
</html>
